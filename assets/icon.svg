<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b7bec"/>
      <stop offset="1" stop-color="#e0559a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="128" rx="58" fill="url(#sheen)"/>
  <!-- Звуковая волна: пять столбиков эквалайзера. Толщина 26 и зазор 24 выбраны
       так, чтобы при сжатии до 16 px столбик и просвет остались по ~1.6 px и
       не слипались в пятно. Скругление концов — половина толщины. -->
  <g fill="#ffffff">
    <rect x="15"  y="98"  width="26" height="60"  rx="13"/>
    <rect x="65"  y="70"  width="26" height="116" rx="13"/>
    <rect x="115" y="42"  width="26" height="172" rx="13"/>
    <rect x="165" y="76"  width="26" height="104" rx="13"/>
    <rect x="215" y="104" width="26" height="48"  rx="13"/>
  </g>
</svg>
