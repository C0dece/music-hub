<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Music Hub — настройки</title>
  <style>
    body { max-width: 520px; margin: 24px auto; padding: 0 16px;
           font: 14px system-ui, sans-serif; background: #14171e; color: #e6e9f0; }
    h1 { font-size: 17px; }
    p { color: #9aa3b5; line-height: 1.5; }
    label { display: block; margin: 14px 0 4px; }
    input { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid #2b3040;
            background: #1c2029; color: #e6e9f0; font: inherit; box-sizing: border-box; }
    button { margin-top: 14px; padding: 7px 14px; border: 0; border-radius: 6px;
             background: #3d7fe0; color: #fff; font: inherit; cursor: pointer; }
    .msg { margin-top: 10px; color: #9aa3b5; min-height: 18px; }
  </style>
</head>
<body>
  <h1>Связь с приложением</h1>
  <p>Ключ показан в приложении: «Настройки» → «Связь с браузером». Он нужен, чтобы
     сторонние страницы не могли управлять вашим проигрывателем. Расширение обращается
     только к 127.0.0.1 и не хранит данные вашей учётной записи VK.</p>
  <label for="token">Ключ доступа</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <label for="port">Порт (обычно 48211)</label>
  <input id="port" type="number" min="1025" max="65535">
  <button id="save">Сохранить</button>
  <button id="check" style="background:#1c2029;border:1px solid #2b3040">Проверить связь</button>
  <div class="msg" id="msg"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
